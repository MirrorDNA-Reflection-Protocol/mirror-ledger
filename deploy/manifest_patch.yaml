# MANIFEST patch for the mirror-ledger weekly pipeline.
#
# Runtime mutations start in ~/.activemirror/body/MANIFEST.yaml (machine law).
# This block is STAGED here rather than applied because the authoring session
# (Claude Code, 2026-08-10) runs behind the deterministic shell gate and cannot
# run body_lattice_sync.py --apply afterwards; applying a manifest change that
# cannot be converged and verified in the same session would leave the control
# plane in an unproven state.
#
# Paul selected the durable Codex automation `mirror-ledger-weekly` on
# 2026-08-10. This LaunchAgent block is now a PARKED RECOVERY PATH ONLY. Never
# set it active while the Codex automation is active; two schedulers would race
# and create a false repair entry. The active Codex schedule is recorded under
# `scheduled: mirror-ledger-weekly-codex` in the body MANIFEST.

scheduled:
  mirror-ledger-weekly-codex:
    command: /bin/bash /Users/pauldesai/repos/mirror-ledger/scripts/run_weekly.sh
    schedule: Mondays 12:30 local time (IST on paul-macbook-air)
    scheduler: codex
    automation_id: mirror-ledger-weekly
    automation_path: ~/.codex/automations/mirror-ledger-weekly/automation.toml
    why: "Durable single-owner scheduler for the public forecast ledger; the LaunchAgent recovery path stays parked and disabled to prevent duplicate runs."

services:
  mirror-ledger-weekly:
    check: launchctl list ai.mirrordna.ledger-weekly 2>/dev/null | grep -q ai.mirrordna
    command: /bin/bash /Users/pauldesai/repos/mirror-ledger/scripts/run_weekly.sh
    depends: []
    label: ai.mirrordna.ledger-weekly
    log: ~/.mirrordna/logs/ledger-weekly.log
    port: null
    schedule_only: true
    receipt_path: ~/.mirrordna/health/mirror_ledger_weekly.json
    receipt_timestamp_field: generated_at
    allowed_statuses:
    - ok
    - fail
    max_age_seconds: 777600
    run_on:
    - paul-macbook-air
    status: parked
    tier: 2
    why: "PARKED RECOVERY PATH ONLY for the weekly forecast ledger. Active scheduling moved by Paul on 2026-08-10 to Codex automation mirror-ledger-weekly, Mondays 12:30 local. Keep this LaunchAgent disabled and never run both schedulers."
